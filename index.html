<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon | Skincare Specialist</title>
    <!-- Tailwind CSS CDN for instant, beautiful styling without setup -->
    <script src="https://tailwindcss.com"></script>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <!-- Using Playfair Display for a premium, high-end skincare aesthetic -->
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        .serif-font {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>
<body class="bg-[#FAF8F5] text-[#332A24] min-h-screen flex flex-col justify-between antialiased selection:bg-[#E6DFD3]">

    <!-- Top Accent Bar -->
    <div class="h-1.5 w-full bg-[#D1C2B0]"></div>

    <!-- Main Content Container -->
    <main class="flex-grow flex flex-col items-center justify-center px-6 py-12 max-w-2xl mx-auto text-center">
        
        <!-- Subtle Premium Badge -->
        <span class="text-xs uppercase tracking-[0.25em] text-[#8C7A6B] font-medium mb-6 block animate-pulse">
            Elevating Your Natural Radiance
        </span>

        <!-- Main Heading -->
        <h1 class="serif-font text-4xl sm:text-5xl lg:text-6xl font-normal leading-tight text-[#261E1A] mb-6">
            Something Beautiful <br>
            <span class="italic font-light text-[#8C7A6B]">is coming soon</span>
        </h1>

        <!-- Divider Line -->
        <div class="w-12 h-[1px] bg-[#D1C2B0] my-6"></div>

        <!-- Description -->
        <p class="text-base sm:text-lg text-[#5E5146] font-light leading-relaxed max-w-md mb-10">
            We are curating a bespoke digital space dedicated to advanced skin health, premium treatments, and curated professional product selections.
        </p>

        <!-- Dynamic Indicator for Client -->
        <div class="inline-flex items-center gap-3 bg-white px-5 py-3 rounded-full shadow-sm border border-[#E6DFD3] text-sm text-[#5E5146]">
            <span class="flex h-2 w-2 relative">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#A3C4BC] opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-[#7BA098]"></span>
            </span>
            Site design & development underway
        </div>

    </main>

    <!-- Footer Space -->
    <footer class="w-full text-center py-8 border-t border-[#E6DFD3] px-6">
        <p class="text-xs tracking-wider text-[#A19488]">
            &copy; 2026 Bespoke Skin Health. All rights reserved.
        </p>
    </footer>

</body>
</html>
